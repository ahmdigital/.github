name: Validate PR Conventional Commit Standards

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TYPES: 'feat|fix|perf|refactor|revert|build|chore|docs|style|test|ci'
      PATTERN: '^([A-Za-z]{2,4}-[0-9]{1,5}:[[:space:]]+)?($TYPES)(\([^)]+\))?!?:[[:space:]]+.+'
      DOCS_LINK: 'https://medibank.atlassian.net/wiki/spaces/AHM/pages/1969062105/Commits+-+Conventional+Commits'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Valid types are taken explicitly from releaseRules in .releaserc.json.
          # Type must be followed by a colon type:
          # Conventional commit breaking marker is allowed: type!: or type(scope)!:
          # Optionally preceded by a Jira ticket prefix (e.g. SF-5310: )

          PATTERN=$(echo "$PATTERN" | sed "s/\$TYPES/$TYPES/g")

          echo "PR title: $PR_TITLE"

          if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "✅ PR title is valid"
            echo ""
            echo "📖 For more information, see the Conventional Commits documentation:"
            echo "  $DOCS_LINK"
          else
            echo "❌ PR title does not match the required format."
            echo ""
            echo "Expected format (matching .releaserc.json headerPattern):"
            echo "  [Jira ticket: ] <type>[(<scope>)][!]: <subject>"
            echo ""
            echo "Valid examples:"
            echo "  feat: add new feature"
            echo "  feat!: introduce breaking API change"
            echo "  feat(auth)!: add new auth feature with breaking change"
            echo "  fix(auth): resolve login issue"
            echo "  SF-5310: feat(scope): add new feature"
            echo ""
            echo "📖 For more information, see the Conventional Commits documentation:"
            echo "  $DOCS_LINK"
            exit 1
          fi

      - name: Validate commit message (if PR has single commit only)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if there's only one commit
          COMMIT_COUNT=$(gh pr view $PR_NUMBER --json commits --jq '.commits | length')
          echo "Number of commits in PR: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -eq 1 ]; then
            PATTERN=$(echo "$PATTERN" | sed "s/\$TYPES/$TYPES/g")

            echo "ℹ️  Single commit detected - validating commit message..."
            echo ""
            echo "ℹ️  Why validate single commits?"
            echo "    When a PR has a single commit, GitHub uses that commit message directly as the"
            echo "    merge commit message (no squashing). Multiple commits are squashed using the PR title."
            echo "    Therefore, single commits must follow the conventional commit standard to ensure"
            echo "    semantic-release can properly analyze the commit and determine the correct version bump."
            echo ""
            COMMIT_MESSAGE=$(gh pr view $PR_NUMBER --json commits --jq '.commits[0].messageHeadline')
            echo "Commit message: $COMMIT_MESSAGE"
            
            if echo "$COMMIT_MESSAGE" | grep -qE "$PATTERN"; then
              echo "✅ Commit message is valid"
              echo ""
              echo "📖 For more information, see the Conventional Commits documentation:"
              echo "  $DOCS_LINK"
            else
              echo "❌ Commit message does not match the required format."
              echo ""
              echo "Expected format (matching .releaserc.json headerPattern):"
              echo "  [Jira ticket: ] <type>[(<scope>)][!]: <subject>"
              echo ""
              echo "Valid examples:"
              echo "  feat: add new feature"
              echo "  feat!: introduce breaking API change"
              echo "  feat(auth)!: add new auth feature with breaking change"
              echo "  fix(auth): resolve login issue"
              echo "  SF-5310: feat(scope): add new feature"
              echo ""
              echo "💡 How to fix this:"
              echo ""
              echo "  Option 1: Push Additional Commits"
              echo "    Simply push another commit to this PR with a proper conventional commit message"
              echo "    (This will result in multiple commits being squashed using the PR title)"
              echo ""
              echo "  Option 2: Amend the Commit Message (Recommended for Single Commits)"
              echo "    git commit --amend"
              echo "    # Update the commit message to follow the format above"
              echo "    git push --force-with-lease"
              echo ""
              echo "  Option 3: Interactive Rebase"
              echo "    git rebase -i HEAD~<commits_to_rebase_from_parent>"
              echo "    # Specifically this branch has $COMMIT_COUNT commits to parent (on remote).
              echo "    # Therefore: git rebase -i HEAD~$COMMIT_COUNT"
              echo "    # Change 'pick' to 'reword' on the commit line"
              echo "    # Update the commit message in the editor"
              echo "    git push --force-with-lease"
              echo ""
              echo "📖 For more information, see the Conventional Commits documentation:"
              echo "  $DOCS_LINK"
              exit 1
            fi
          else
            echo "ℹ️  Multiple commits detected - skipping individual commit validation"
          fi

  # Required status check for merge queue; GitHub needs at least one job to trigger on merge_group events
  merge-group:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Merge queue check passed"
