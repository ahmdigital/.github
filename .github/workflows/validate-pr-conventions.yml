name: Enforce PR Conventional Commit Standards

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: write
  pull-requests: write

jobs:
  normalise-reverts:
    name: Normalise Revert Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Release 6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Check and amend revert commits
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the last commit message and hash
          LAST_MSG=$(git log -1 --pretty=%B)
          LAST_HASH=$(git log -1 --pretty=%H)
          
          echo "🔍 Current PR title: $PR_TITLE"
          
          # Check if it matches GitHub's revert format: Revert "..." (#123)
          if [[ $LAST_MSG =~ ^Revert\ \"(.*)\"(\ \(\#([0-9]+)\))?$ ]]; then
            ORIGINAL="${BASH_REMATCH[1]}"
            NEW_MSG="revert: $ORIGINAL"
            
            echo "🔄 Detected GitHub revert commit"
            echo "Original message: $LAST_MSG"
            echo "New message: $NEW_MSG"
            
            # Append commit hash as a link to the PR body
            COMMIT_LINK="https://github.com/${{ github.repository }}/commit/$LAST_HASH"
            UPDATED_BODY=$(printf "%s\n\nReverts %s" "$PR_BODY" "$COMMIT_LINK")

            # Update the PR title to match the new commit message
            echo "📝 Updating PR title to: $NEW_MSG"
            gh pr edit $PR_NUMBER --title "$NEW_MSG"
            echo "✅ PR title updated"

            # Update the PR body
            echo "📝 Updating PR body..."
            gh pr edit $PR_NUMBER --body "$UPDATED_BODY"
            echo "✅ PR body updated with commit link"
            
            # Then update the commit message
            git commit --amend -m "$NEW_MSG"
            git push --force-with-lease
            
            echo "✅ Commit message normalized to conventional commit format"
          else
            echo "ℹ️ Last commit is not a GitHub revert, no action needed"
          fi

  validate-pr-conventions:
    name: Validate PR Conventions
    needs: [normalise-reverts]
    runs-on: ubuntu-latest
    env:
      TYPES: 'feat|fix|perf|refactor|revert|build|chore|docs|style|test|ci'
      PATTERN: '^([A-Za-z]{2,4}-[0-9]{1,5}:[[:space:]]+)?($TYPES)(\([^)]+\))?!?:[[:space:]]+.+'
      DOCS_LINK: 'https://medibank.atlassian.net/wiki/spaces/AHM/pages/1969062105/Commits+-+Conventional+Commits'
    steps:
      - name: Checkout code
        # Release 6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Valid types are taken explicitly from releaseRules in .releaserc.json.
          # Type must be followed by a colon type:
          # Conventional commit breaking marker is allowed: type!: or type(scope)!:
          # Optionally preceded by a Jira ticket prefix (e.g. SF-5310: )

          PATTERN=$(echo "$PATTERN" | sed "s/\$TYPES/$TYPES/g")

          echo "PR title: $PR_TITLE"

          if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "✅ PR title is valid"
            echo ""
            echo "📖 For more information, see the Conventional Commits documentation:"
            echo "  $DOCS_LINK"
          else
            echo "❌ PR title does not match the required format."
            echo ""
            echo "Expected format (matching .releaserc.json headerPattern):"
            echo "  [Jira ticket: ] <type>[(<scope>)][!]: <subject>"
            echo ""
            echo "Valid examples:"
            echo "  feat: add new feature"
            echo "  feat!: introduce breaking API change"
            echo "  feat(auth)!: add new auth feature with breaking change"
            echo "  fix(auth): resolve login issue"
            echo "  SF-5310: feat(scope): add new feature"
            echo ""
            echo "📖 For more information, see the Conventional Commits documentation:"
            echo "  $DOCS_LINK"
            exit 1
          fi

      - name: Validate commit message (if PR has single commit only)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if there's only one commit
          COMMIT_COUNT=$(gh pr view $PR_NUMBER --json commits --jq '.commits | length')
          echo "Number of commits in PR: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -eq 1 ]; then
            PATTERN=$(echo "$PATTERN" | sed "s/\$TYPES/$TYPES/g")

            echo "ℹ️  Single commit detected - validating commit message..."
            echo ""
            echo "ℹ️  Why validate single commits?"
            echo "    When a PR has a single commit, GitHub uses that commit message directly as the"
            echo "    merge commit message (no squashing). Multiple commits are squashed using the PR title."
            echo "    Therefore, single commits must follow the conventional commit standard to ensure"
            echo "    semantic-release can properly analyze the commit and determine the correct version bump."
            echo ""
            COMMIT_MESSAGE=$(gh pr view $PR_NUMBER --json commits --jq '.commits[0].messageHeadline')
            echo "Commit message: $COMMIT_MESSAGE"
            
            if echo "$COMMIT_MESSAGE" | grep -qE "$PATTERN"; then
              echo "✅ Commit message is valid"
              echo ""
              echo "📖 For more information, see the Conventional Commits documentation:"
              echo "  $DOCS_LINK"
            else
              echo "❌ Commit message does not match the required format."
              echo ""
              echo "Expected format (matching .releaserc.json headerPattern):"
              echo "  [Jira ticket: ] <type>[(<scope>)][!]: <subject>"
              echo ""
              echo "Valid examples:"
              echo "  feat: add new feature"
              echo "  feat!: introduce breaking API change"
              echo "  feat(auth)!: add new auth feature with breaking change"
              echo "  fix(auth): resolve login issue"
              echo "  SF-5310: feat(scope): add new feature"
              echo ""
              echo "💡 How to fix this:"
              echo ""
              echo "  Option 1: Push Additional Commits"
              echo "    Simply push another commit to this PR with a proper conventional commit message"
              echo "    (This will result in multiple commits being squashed using the PR title)"
              echo ""
              echo "  Option 2: Amend the Commit Message (Recommended for Single Commits)"
              echo "    git commit --amend"
              echo "    # Update the commit message to follow the format above"
              echo "    git push --force-with-lease"
              echo ""
              echo "  Option 3: Interactive Rebase"
              echo "    git rebase -i HEAD~<commits_to_rebase_from_parent>"
              echo "    # Specifically this branch has $COMMIT_COUNT commits to parent (on remote).
              echo "    # Therefore: git rebase -i HEAD~$COMMIT_COUNT"
              echo "    # Change 'pick' to 'reword' on the commit line"
              echo "    # Update the commit message in the editor"
              echo "    git push --force-with-lease"
              echo ""
              echo "📖 For more information, see the Conventional Commits documentation:"
              echo "  $DOCS_LINK"
              exit 1
            fi
          else
            echo "ℹ️  Multiple commits detected - skipping individual commit validation"
          fi

      - name: Validate breaking change consistency
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Check for breaking change marker in title (!)
          HAS_BREAKING_MARKER=false
          if echo "$PR_TITLE" | grep -qE '!:'; then
            HAS_BREAKING_MARKER=true
          fi

          # Check for BREAKING CHANGE or BREAKING CHANGES in body
          HAS_BREAKING_FOOTER=false
          if echo "$PR_BODY" | grep -qiE 'BREAKING\s+CHANGE'; then
            HAS_BREAKING_FOOTER=true
          fi

          # Validate consistency
          if [ "$HAS_BREAKING_MARKER" = true ] && [ "$HAS_BREAKING_FOOTER" = false ]; then
            echo "❌ Breaking change declared in title but not documented in PR description."
            echo ""
            echo "The '!' marker in the title indicates a breaking change, but 'BREAKING CHANGE/S' footer is missing."
            echo ""
            echo "💡 How to fix this:"
            echo ""
            echo "  Add a breaking change footer to your PR description:"
            echo ""
            echo "  BREAKING CHANGES:\n -<description of what broke and how to migrate> \n -<additional breaking changes if needed>"
            echo ""
            echo "📖 For more information, see the Conventional Commits documentation:"
            echo "  $DOCS_LINK"
            exit 1
          elif [ "$HAS_BREAKING_MARKER" = false ] && [ "$HAS_BREAKING_FOOTER" = true ]; then
            echo "❌ Breaking change documented in PR description but not declared in title."
            echo ""
            echo "The 'BREAKING CHANGE' footer is present, but the title is missing the '!' breaking change marker."
            echo ""
            echo "💡 How to fix this:"
            echo ""
            echo "  Update the PR title to include the '!' marker before the colon:"
            echo ""
            echo "  <type>!: <subject>"
            echo "  Example: feat!: remove legacy API endpoint"
            echo ""
            echo "  Or if it's a scoped change:"
            echo "  <type>(<scope>)!: <subject>"
            echo "  Example: feat(auth)!: change authentication flow"
            echo ""
            echo "📖 For more information, see the Conventional Commits documentation:"
            echo "  $DOCS_LINK"
            exit 1
          elif [ "$HAS_BREAKING_MARKER" = true ] && [ "$HAS_BREAKING_FOOTER" = true ]; then
            echo "✅ Breaking change is properly declared in both title and description"
            echo ""
            echo "📖 For more information, see the Conventional Commits documentation:"
            echo "  $DOCS_LINK"
          fi

